<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JupiterLearn - اختبار الرياضيات</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: #0f0f1a;
        color: #fff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        direction: rtl;
      }
      .container {
        width: 700px;
        padding: 20px;
      }
      .header {
        background: linear-gradient(135deg, #1a1a3e, #16213e);
        padding: 25px;
        border-radius: 15px;
        text-align: center;
        margin-bottom: 20px;
        border: 1px solid #2a2a5e;
      }
      .header h1 {
        font-size: 24px;
        margin-bottom: 5px;
      }
      .header span {
        color: #888;
        font-size: 14px;
      }
      .card {
        background: #16213e;
        padding: 25px;
        border-radius: 15px;
        border: 1px solid #2a2a5e;
        margin-bottom: 15px;
      }
      .btn {
        padding: 12px 30px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: 0.3s;
      }
      .btn-primary {
        background: #2196f3;
        color: #fff;
        width: 100%;
      }
      .btn-primary:hover {
        background: #1976d2;
      }
      .btn-success {
        background: #4caf50;
        color: #fff;
        width: 100%;
      }
      .btn-success:hover {
        background: #388e3c;
      }
      .btn-danger {
        background: #e94560;
        color: #fff;
        width: 100%;
      }
      .btn-danger:hover {
        background: #c62828;
      }
      .btn-outline {
        background: transparent;
        border: 2px solid #2196f3;
        color: #2196f3;
        width: 100%;
      }
      .btn-outline:hover {
        background: #2196f3;
        color: #fff;
      }
      .input {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border-radius: 10px;
        border: 1px solid #2a2a5e;
        background: #1a1a3e;
        color: #fff;
        font-size: 15px;
      }
      .question-text {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 20px;
        line-height: 1.6;
      }
      .option {
        display: block;
        width: 100%;
        padding: 15px 20px;
        margin: 10px 0;
        background: #1a1a3e;
        border: 2px solid #2a2a5e;
        border-radius: 10px;
        cursor: pointer;
        text-align: right;
        font-size: 16px;
        transition: 0.2s;
        color: #fff;
      }
      .option:hover {
        border-color: #2196f3;
        background: #1e1e4e;
      }
      .option.selected {
        border-color: #4caf50;
        background: #1a3a1a;
      }
      .progress {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .dot {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        background: #2a2a5e;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        transition: 0.2s;
      }
      .dot.current {
        background: #2196f3;
        transform: scale(1.2);
      }
      .dot.answered {
        background: #4caf50;
      }
      .dot:hover {
        background: #3a3a7e;
      }
      .nav-buttons {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      .timer {
        font-size: 18px;
        color: #f0a500;
        text-align: center;
        margin-bottom: 15px;
      }
      .result {
        text-align: center;
      }
      .result .score {
        font-size: 60px;
        font-weight: bold;
        color: #4caf50;
      }
      .result .failed {
        color: #e94560;
      }
      .result .detail {
        font-size: 16px;
        color: #aaa;
        margin-top: 10px;
      }
      .log {
        background: #000;
        padding: 15px;
        border-radius: 10px;
        margin-top: 15px;
        max-height: 120px;
        overflow-y: auto;
        font-size: 11px;
        font-family: monospace;
      }
      .log .success {
        color: #4caf50;
      }
      .log .error {
        color: #e94560;
      }
      .log .info {
        color: #2196f3;
      }
      .hidden {
        display: none;
      }
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        align-items: center;
        justify-content: center;
        z-index: 1000;
        display: none;
      }
      .modal.show {
        display: flex;
      }
      .modal-content {
        background: #16213e;
        padding: 30px;
        border-radius: 15px;
        text-align: center;
        max-width: 400px;
        width: 90%;
      }
      .modal-content h3 {
        margin-bottom: 15px;
      }
      .modal-content p {
        margin-bottom: 20px;
        color: #aaa;
      }
      .modal-buttons {
        display: flex;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>JupiterLearn</h1>
        <span>منصة التعليم الإلكتروني</span>
      </div>

      <div class="card" id="loginCard">
        <h3 style="margin-bottom: 15px">تسجيل الدخول</h3>
        <input
          class="input"
          type="text"
          id="phone"
          placeholder="رقم التليفون"
          value="01023143535"
        />
        <input
          class="input"
          type="password"
          id="password"
          placeholder="الباسورد"
          value="abc@123"
        />
        <button
          class="btn btn-primary"
          onclick="login()"
          style="margin-top: 10px"
        >
          دخول
        </button>
      </div>

      <div class="card hidden" id="examCard">
        <h3 style="text-align: center" id="examTitle"></h3>
        <div class="timer" id="timer"></div>
        <div class="progress" id="progressDots"></div>
        <div class="question-text" id="questionText"></div>
        <div id="optionsContainer"></div>
        <div class="nav-buttons">
          <button
            class="btn btn-outline hidden"
            id="prevBtn"
            onclick="prevQuestion()"
          >
            السابق
          </button>
          <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">
            التالي
          </button>
        </div>
        <button
          class="btn btn-danger"
          id="submitBtn"
          onclick="showSubmitConfirm()"
          style="margin-top: 15px"
        >
          تسليم الامتحان
        </button>
      </div>

      <div class="card hidden" id="resultCard">
        <h3 style="text-align: center">نتيجة الامتحان</h3>
        <div class="result" id="resultContent"></div>
        <button
          class="btn btn-primary"
          onclick="location.reload()"
          style="margin-top: 20px"
        >
          إعادة
        </button>
      </div>

      <div class="log" id="logContainer"></div>
    </div>

    <div class="modal" id="confirmModal">
      <div class="modal-content">
        <h3>تأكيد التسليم</h3>
        <p id="confirmMsg"></p>
        <div class="modal-buttons">
          <button class="btn btn-outline" onclick="closeModal()">مراجعة</button>
          <button class="btn btn-danger" onclick="confirmSubmit()">
            تسليم
          </button>
        </div>
      </div>
    </div>

    <script>
      const BASE_URL = "http://localhost:3000";
      const CREDENTIAL = btoa(
        "Abdelrhman_Elshaer@jupiterLearn.com:Elshaer@jupiterLearn2026",
      );
      let studentToken = "";
      let currentExamId = 1;
      let questions = [];
      let currentIndex = 0;
      let answers = {};
      let timerInterval;

      function log(msg, type = "info") {
        const c = document.getElementById("logContainer");
        c.innerHTML += `<div class="${type}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
        c.scrollTop = c.scrollHeight;
      }

      async function login() {
        try {
          log("جاري تسجيل الدخول...");
          const res = await fetch(`${BASE_URL}/api/auth/student/login`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Basic ${CREDENTIAL}`,
            },
            body: JSON.stringify({
              phone: document.getElementById("phone").value,
              password: document.getElementById("password").value,
            }),
          });
          const data = await res.json();
          if (data.success) {
            studentToken = data.token;
            log("تم تسجيل الدخول!", "success");
            document.getElementById("loginCard").classList.add("hidden");
            startExam();
          } else {
            log("فشل: " + data.message, "error");
          }
        } catch (e) {
          log("خطأ: " + e.message, "error");
        }
      }

      async function startExam() {
        try {
          log("جاري بدء الامتحان...");
          const res = await fetch(
            `${BASE_URL}/api/student/exams/online/${currentExamId}/start`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Basic ${CREDENTIAL}`,
                "x-client-key": studentToken,
              },
            },
          );
          const data = await res.json();
          if (data.success) {
            questions = data.data.questions;
            log(`تم بدء الامتحان! ${questions.length} أسئلة`, "success");
            document.getElementById("examCard").classList.remove("hidden");
            renderProgress();
            showQuestion(0);
            startTimer(30);
          } else {
            log("فشل: " + data.message, "error");
          }
        } catch (e) {
          log("خطأ: " + e.message, "error");
        }
      }

      function renderProgress() {
        let dots = "";
        questions.forEach((q, i) => {
          let cls = "dot";
          if (i === currentIndex) cls += " current";
          if (answers[q.id]) cls += " answered";
          dots += `<div class="${cls}" onclick="showQuestion(${i})">${i + 1}</div>`;
        });
        document.getElementById("progressDots").innerHTML = dots;
        document.getElementById("examTitle").textContent =
          `اختبار الرياضيات (${questions.length} أسئلة)`;
      }

      function showQuestion(index) {
        if (index < 0 || index >= questions.length) return;
        currentIndex = index;
        const q = questions[index];
        document.getElementById("questionText").textContent =
          `سؤال ${index + 1}: ${q.question_text}`;

        let html = "";
        if (q.options) {
          q.options.forEach((opt) => {
            const selected = answers[q.id] === opt.id ? " selected" : "";
            html += `<div class="option${selected}" onclick="selectAnswer(${q.id}, ${opt.id}, this)">${opt.option_text}</div>`;
          });
        }
        document.getElementById("optionsContainer").innerHTML = html;

        document
          .getElementById("prevBtn")
          .classList.toggle("hidden", index === 0);
        document
          .getElementById("nextBtn")
          .classList.toggle("hidden", index === questions.length - 1);
        renderProgress();
      }

      function selectAnswer(questionId, optionId, element) {
        answers[questionId] = optionId;
        document
          .querySelectorAll(".option")
          .forEach((el) => el.classList.remove("selected"));
        element.classList.add("selected");
        renderProgress();
        log(`تم اختيار إجابة للسؤال ${questionId} (لم ترسل بعد)`, "info");
      }

      function nextQuestion() {
        if (currentIndex < questions.length - 1) showQuestion(currentIndex + 1);
      }
      function prevQuestion() {
        if (currentIndex > 0) showQuestion(currentIndex - 1);
      }

      function startTimer(minutes) {
        let time = minutes * 60;
        const timerEl = document.getElementById("timer");
        timerInterval = setInterval(() => {
          const m = Math.floor(time / 60),
            s = time % 60;
          timerEl.textContent = `⏱ ${m}:${s < 10 ? "0" + s : s}`;
          if (time <= 0) {
            clearInterval(timerInterval);
            autoSubmit();
          }
          time--;
        }, 1000);
      }

      function showSubmitConfirm() {
        const answered = Object.keys(answers).length;
        document.getElementById("confirmMsg").textContent =
          `أجبت على ${answered} من ${questions.length} أسئلة. هل تريد تسليم الامتحان؟`;
        document.getElementById("confirmModal").classList.add("show");
      }

      function closeModal() {
        document.getElementById("confirmModal").classList.remove("show");
      }

      async function confirmSubmit() {
        closeModal();
        document.getElementById("submitBtn").disabled = true;
        await submitAllAnswers();
      }

      async function autoSubmit() {
        log("انتهى الوقت! جاري التسليم التلقائي...", "error");
        await submitAllAnswers();
      }

      async function submitAllAnswers() {
        clearInterval(timerInterval);
        try {
          log("جاري إرسال كل الإجابات...");
          let sent = 0;
          for (const [questionId, optionId] of Object.entries(answers)) {
            await fetch(
              `${BASE_URL}/api/student/exams/online/${currentExamId}/answer`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: `Basic ${CREDENTIAL}`,
                  "x-client-key": studentToken,
                },
                body: JSON.stringify({
                  questionId: parseInt(questionId),
                  selectedOptionId: optionId,
                }),
              },
            );
            sent++;
          }
          log(`تم إرسال ${sent} إجابة`, "success");

          log("جاري تسليم الامتحان...");
          const res = await fetch(
            `${BASE_URL}/api/student/exams/online/${currentExamId}/submit`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Basic ${CREDENTIAL}`,
                "x-client-key": studentToken,
              },
            },
          );
          const data = await res.json();
          if (data.success) {
            const pct = Math.round(
              (data.data.score / data.data.total_questions) * 100,
            );
            const passed = pct >= 50;
            document.getElementById("examCard").classList.add("hidden");
            document.getElementById("resultCard").classList.remove("hidden");
            document.getElementById("resultContent").innerHTML = `
                        <div class="score ${passed ? "" : "failed"}">${pct}%</div>
                        <div class="detail">${data.data.correct_answers} / ${data.data.total_questions} إجابات صحيحة</div>
                        <div class="detail" style="color:${passed ? "#4caf50" : "#e94560"};">${passed ? "ناجح" : "راسب"}</div>
                    `;
            log(`تم التسليم! النتيجة: ${pct}%`, "success");
          }
        } catch (e) {
          log("خطأ: " + e.message, "error");
        }
      }
    </script>
  </body>
</html>
